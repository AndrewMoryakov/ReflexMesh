[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflexmesh"
version = "0.2.0"
description = "Routing and an experimental controlled browser runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reflexmesh = "reflexmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
